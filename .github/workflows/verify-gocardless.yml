name: Verify GoCardless plans
on:
  pull_request:
    paths:
      - 'src/lib/gocardless.ts'
      - 'src/lib/pricing.ts'
      - 'src/lib/client-pricing.ts'
      - 'src/lib/dvotion-pricing.ts'
      - 'src/app/api/direct-debit/**'
      - 'src/app/api/webhooks/gocardless/**'
      - 'src/app/checkout/**'
      - 'tests/**'
      - '.github/workflows/verify-gocardless.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
