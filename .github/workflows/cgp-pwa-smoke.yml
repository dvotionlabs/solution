name: Verify CGP app installation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cgp-pwa-smoke.yml
      - src/app/manifest.ts
      - src/app/pwa/**
      - src/app/portal/**
      - public/sw.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live routes and PWA files
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          base='https://cgp-dvotion.vercel.app'
          endpoints=['/','/portal','/admin','/manifest.webmanifest','/sw.js','/pwa/offline.html','/pwa/icon-192.png','/pwa/icon-512.png','/pwa/icon-maskable.png','/apple-icon.png']
          failures=[]
          for path in endpoints:
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'CGP-PWA-HealthCheck/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      raw=r.read(4096)
                      ct=r.headers.get('Content-Type','')
                      print(f'{path}: {r.status} {ct}; final={r.url}',flush=True)
                      if r.status!=200:failures.append(f'{path} status {r.status}')
                      if path in ['/','/portal','/admin'] and b'This page could not be found' in raw:failures.append(f'{path} returned custom not-found HTML')
                      if path.endswith('.png') and not ct.startswith('image/png'):failures.append(f'{path} not PNG')
                      if path.endswith('.webmanifest'):
                          try:
                              m=json.loads(raw.decode('utf-8'))
                              print('Manifest:',json.dumps({k:m.get(k) for k in ('id','name','start_url','scope','display','icons')}))
                          except Exception as e:failures.append(f'manifest invalid: {e}')
              except urllib.error.HTTPError as e:
                  print(f'{path}: HTTP {e.code}; {e.read(300)!r}',flush=True)
                  failures.append(f'{path} returned {e.code}')
              except Exception as e:
                  print(f'{path}: error {e}',flush=True)
                  failures.append(f'{path} failed: {e}')
          if failures: raise SystemExit('FAILED: '+'; '.join(failures))
          print('All PWA endpoints respond with expected types.')
          PY
